[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "0.1.0"
description = "DocLens: Multimodal RAG for technical documentation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24.0",
    "easyocr>=1.7",
    "typer>=0.12",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
]

[project.scripts]
doclens = "doclens.cli:app"

[tool.setuptools]
packages = ["doclens", "doclens.ingest", "doclens.retrieval", "doclens.embed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
markers = ["slow: downloads model weights, run explicitly"]
